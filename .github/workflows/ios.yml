# The iOS logging app (ios/). No Mac here, so a GitHub macOS runner generates the Xcode project (XcodeGen) and builds it.
# Without the App Store Connect secrets: a simulator build (does it compile). With them: archive unsigned (a signed
# archive wants a development profile, i.e. a registered device), then the export signs it for distribution (Xcode's
# cloud signing through the API key) and uploads to TestFlight.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text; key role Admin, for cloud signing),
# APPLE_TEAM_ID. Variable: IOS_BUNDLE_ID (default com.personaldb.log; the App Store Connect app must use the same).
# A public repo, so macOS runners are free. Builds number from 101 up (the earlier builds came from another repo).
name: iOS app

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.personaldb.log' }}
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Build number (run number + 100)
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          # App Store Connect takes only builds from the current SDK (iOS 26+): use the newest Xcode on the runner
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build for the simulator
        if: env.HAS_SIGNING != 'true'
        working-directory: ios
        run: |
          xcodebuild -project PersonalLog.xcodeproj -scheme PersonalLog -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | head -60; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | head -30 || true
          tail -3 build.log

      - name: Archive and upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/asc.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project PersonalLog.xcodeproj -scheme PersonalLog -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PersonalLog.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO archive > archive.log 2>&1 \
            || { grep -E "error:" archive.log | head -60; tail -40 archive.log; exit 1; }
          tail -3 archive.log
          # the archive is unsigned (no development profile), so its entitlements (HealthKit) go on with an ad-hoc
          # signature here; the export re-signs for distribution with them, and automatic signing adds the capability
          codesign -f -s - --entitlements PersonalLog/PersonalLog.entitlements             "$RUNNER_TEMP/PersonalLog.xcarchive/Products/Applications/PersonalLog.app"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PersonalLog.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
