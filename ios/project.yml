# XcodeGen spec for the logging app (no Mac here: GitHub Actions generates the project and builds it, see
# .github/workflows/ios.yml). BUNDLE_ID / BUILD_NUMBER come from the environment.
name: PersonalLog
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
targets:
  PersonalLog:
    type: application
    platform: iOS
    sources:
      - PersonalLog
      - path: Shortcuts   # the signed "Log Foods From App", offered in Settings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: PersonalLog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: PersonalLog/Info.plist
      properties:
        CFBundleDisplayName: Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [shortcuts]
        NSCameraUsageDescription: The Find tab's camera search shows the PC what you are pointing at, to spot a lost item.
        NSCalendarsFullAccessUsageDescription: The Chores tab plans chores in your free time, so it reads when your calendar events are (busy times only).
        CFBundleURLTypes:
          - CFBundleURLName: personallog
            CFBundleURLSchemes: [personallog]
